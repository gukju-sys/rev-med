# ============================================================
# Netlify 배포 설정 (권장 호스팅)
# 이 폴더를 app.netlify.com/drop 에 드래그하면 자동 적용됩니다.
# ============================================================

[build]
  # 정적 사이트라 빌드 과정 없음. 이 폴더 전체가 그대로 배포됨.
  publish = "."

# 보안 헤더 (모든 페이지 적용)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 내부/개발 파일 접근 차단 (드래그 배포 시 함께 올라가도 노출되지 않도록)
[[redirects]]
  from = "/apps-script/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/clinic-sheet-template.csv"
  to = "/404.html"
  status = 404

# 참고: www → 비-www(또는 그 반대) 리다이렉트는 Netlify 대시보드의
# Domain settings에서 "Primary domain"을 지정하면 자동 처리됩니다.
